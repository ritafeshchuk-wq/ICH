<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИЧ — исполнительный чертёж по съёмке</title>
<style>
:root{--paper:#eeeff0;--panel:#fff;--ink:#1d1e20;--muted:#5f6368;--line:#d6d8db;--deep:#2a2b2e;--blue:#1f3a93;--warn:#8a5a00;--warn-bg:#fff4d6;--ok-bg:#e7f3ea;--ok:#1f5a35;
--head:Bahnschrift,"DIN Condensed","DIN Alternate","Arial Narrow","Segoe UI",system-ui,sans-serif;--body:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.45 var(--body);color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);font-stretch:80%;margin:0;font-weight:600;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:18px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px}.mark{font:700 30px/1 var(--head);font-stretch:75%;letter-spacing:.02em}.brand .sep{width:1px;height:28px;background:var(--line)}.brand .sub{font-size:12px;line-height:1.2;color:var(--muted)}
.top-info{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;line-height:1.2}.btn:hover:not(:disabled){border-color:#9aa0a6}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}.btn.primary:hover:not(:disabled){filter:brightness(1.35)}
.btn.ghost{background:transparent}.btn.small{padding:4px 9px;font-size:12.5px}.btn.danger{color:#9b1c1c}.btn:disabled,.seg:disabled,.chip:disabled{opacity:.45;cursor:not-allowed}
.work{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 470px}
.side,.card{background:var(--panel);overflow:auto;padding:14px}.side{border-right:1px solid var(--line)}.card{border-left:1px solid var(--line)}
.side h2,.card h2{font-size:17px;margin-bottom:10px}.card-head h2{font-size:22px}
.card h3,.side h3.sh{font-size:15px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--deep)}
.files{list-style:none;margin:0;padding:0;font-size:13px}.files li{padding:3px 0;border-bottom:1px dashed var(--line);word-break:break-all}.files .gen{font-weight:700}
.objs{display:flex;flex-direction:column;gap:6px}
.obj{position:relative;display:grid;gap:1px;text-align:left;border:1px solid var(--line);border-left:4px solid transparent;background:#fff;border-radius:6px;padding:8px 34px 8px 10px;cursor:pointer}.obj:hover{border-left-color:var(--ink);background:#f4f5f6}
.obj-no{font:600 17px/1.2 var(--head);font-stretch:85%}.obj-net{color:var(--muted);font-size:12.5px}.obj-meta{font-size:12.5px}.obj-meta i{color:var(--muted);font-style:normal}
.flag,.ok{position:absolute;right:9px;top:9px;min-width:20px;height:20px;border-radius:10px;font-size:12px;display:grid;place-items:center;padding:0 5px}.flag{background:var(--warn-bg);color:var(--warn);font-weight:700}.ok{color:#2c7a4b}
.issues{margin:6px 0}.issue{margin:0 0 6px;padding:7px 10px;background:var(--warn-bg);color:#5c3d00;border-left:3px solid #e0a100;border-radius:0 5px 5px 0;font-size:13px}.fine{margin:6px 0;color:var(--muted);font-size:13px}
.pts{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:8px 10px}.pts summary{cursor:pointer;font-weight:600;font-size:13px}
.desk{min-width:0;display:flex;flex-direction:column;background-color:#e4e5e7;background-image:linear-gradient(#d0d2d5 1px,transparent 1px),linear-gradient(90deg,#d0d2d5 1px,transparent 1px);background-size:100px 100px}
.tabs{display:flex;gap:4px;padding:10px 14px 0;flex-wrap:wrap;align-items:flex-end}.tab{border:1px solid var(--line);border-bottom:0;background:#f3f4f5;border-radius:6px 6px 0 0;padding:6px 12px;cursor:pointer;font-size:13px}.tab.on{background:#fff;font-weight:600;box-shadow:inset 0 3px 0 var(--ink)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700}
.zoombar{margin-left:auto;display:flex;gap:4px;padding-bottom:4px}
.desk-scroll{flex:1;min-height:0;overflow:auto;margin:0 14px;background:#fff;box-shadow:0 1px 2px rgba(27,36,32,.25),0 8px 24px rgba(27,36,32,.12)}
#vp{overflow:hidden}svg.draw{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;font-family:Arial,sans-serif}svg.draw.grab{cursor:grabbing}
svg.draw polyline,svg.draw polygon,svg.draw circle{vector-effect:non-scaling-stroke;stroke-width:1}
.desk-hint{margin:0;padding:6px 14px 10px;font-size:12.5px;color:var(--muted)}.pad{padding:14px}
.sum{width:100%;border-collapse:collapse;font-size:13px}.sum th,.sum td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}.sum .num{text-align:right;white-space:nowrap}
.ctab tr.k-fit td{background:#eef3fb}.ctab tr.k-diff td{background:var(--warn-bg)}.ctab tr.k-bad td{background:#fdecec}.ctab tr.k-none td,.ctab tr.k-info td{color:var(--muted)}
.segs{display:flex;align-items:center;font-size:13px;margin:4px 0 10px}.segs span{color:var(--muted);margin-right:8px}.seg{border:1px solid var(--line);background:#fff;padding:6px 12px;cursor:pointer}.seg:first-of-type{border-radius:6px 0 0 6px}.seg:last-of-type{border-radius:0 6px 6px 0;border-left:0}.seg.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tolrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:6px}.tolrow.off{opacity:.55}.chips{display:flex;gap:4px}.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 10px;cursor:pointer;font-size:12.5px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:3px;font-size:12px;color:var(--muted);margin:6px 0}.fld textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13.5px;resize:vertical;color:var(--ink)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff;font-size:14px;color:var(--ink)}
.chk-l,.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.hint{color:var(--muted);font-size:12.5px;margin:4px 0}
.ptwrap{overflow-x:auto}.ptab{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:12px}.ptab th{text-align:left;color:var(--muted);font-weight:500;padding:2px 3px;white-space:nowrap}.ptab td{padding:1px 2px}
.ptab input{width:100%;min-width:50px;border:1px solid var(--line);border-radius:4px;padding:4px 5px;font-size:12.5px;background:#fff}.ptab td.rn{color:var(--muted);font-size:11.5px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.empty{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;padding:6vh 6vw;max-width:1200px;margin:0 auto;width:100%}
.drop{border:2px dashed #9a9da2;border-radius:10px;background:#f9f9fa;padding:56px 40px;cursor:pointer}.drop:hover,body.drag .drop{border-color:var(--ink);background:#fff}
.drop h1{font-size:34px;line-height:1.1;margin-bottom:14px}.drop p{color:var(--muted);max-width:52ch;margin:0 0 22px}
.steps{margin:0;padding-left:22px;display:grid;gap:16px;color:var(--muted);max-width:46ch}.steps b{color:var(--ink)}
body.drag .work{outline:3px dashed var(--ink);outline-offset:-8px}
.cheat{font-size:13px;background:#f7f8f9;border:1px solid var(--line);border-radius:6px;padding:10px 12px}.cheat p{margin:0 0 6px}.cheat p:last-child{margin:0;color:var(--muted)}
.veil{position:fixed;inset:0;background:rgba(27,36,32,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:#fff;border-radius:10px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-body{padding:6px 18px 18px;overflow:auto}.help h3{font-size:16px;margin:14px 0 6px}.help p{margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1150px){.work{grid-template-columns:220px minmax(0,1fr)}.card{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}#app{height:auto;min-height:100%}.desk{min-height:70vh}}
@media (max-width:720px){.work{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.objs{flex-direction:row;overflow:auto}.obj{min-width:160px}.empty{grid-template-columns:1fr;padding:24px 16px}.drop{padding:32px 20px}.drop h1{font-size:26px}.top{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.ptab td:nth-child(2) input{min-width:64px}.ptab td:nth-child(3) input{min-width:68px}
.nets{display:flex;flex-direction:column;gap:5px}.net{display:grid;gap:1px;text-align:left;border:1px solid var(--line);border-left:4px solid transparent;background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px}.net.on{border-left-color:var(--ink);background:#f4f5f6}.net span{color:var(--muted);font-size:12px}.net em{font-style:normal;font-size:12px}.net em.yes{color:#2c7a4b}.net em.no{color:var(--warn)}
svg.draw text{stroke:none}
.geo-need{margin:0 0 12px;padding:9px 11px;background:#fdecea;color:#7a1b12;border-left:3px solid #c62828;border-radius:0 5px 5px 0;font-size:13px}.geo-need .row{margin-top:8px}
.k-ok td{color:#2c7a4b}.k-diff td{color:#b3261e}
</style></head>

const f1 = v => rnd(v, 1).toFixed(1), f2 = v => rnd(v, 2).toFixed(2), f3 = v => rnd(v, 3).toFixed(3);

// настройки перехода по умолчанию — как в принятых ИЧ
const GNB_DEFAULT = {
  no: '', n: 19, d: 110, sdr: '13.6', mat: 'ПЭ 100', gost: 'ГОСТ 18599-2001', dskv: 700,
  reverse: false, chain: 0, groundA: '', groundB: '', pit: 0.70, dcorr: '',
  cables: '', cover: '', cross: '',
  projPlan: '', projArc: '',
  // протокол бурения
  city: 'г. Москва', protDate: '', pilot: 90, reams: '200, 400', reamer: 'Кодиак', locator: 'F-2', sonde: 'FX (серый)', rod: 3.05, dStart: '', dEnd: '',
  // штамп
  org: '', object: '', customer: 'ГКУ "ДКР"', order: '', designer: '', ops: '', yStart: '', yEnd: '', insp: 'Административная инспекция',
  chief: '', pm: '', geod: '', chiefPost: 'Гл.инженер', pmPost: 'Рук.проекта', geodPost: 'Геодезист'
};

// ---------------- переходы в съёмке ----------------
// точки 4028 по порядку номеров; «..» — продолжение предыдущей точки, без связи — начало нового перехода
function gnbChains(P) {
  const pts = P.filter(p => p.code === '4028').sort((a, b) => a.n - b.n), chains = [];
  let cur = null;
  pts.forEach(p => {
    if (!p.link || !cur) { cur = [p]; chains.push(cur); return; }
    const r = p.link.slice(2).split(',').filter(Boolean).map(Number);
    if (r.length && !cur.some(q => q.n === r[0])) { const ch = chains.find(c => c.some(q => q.n === r[0])); if (ch) { ch.push(p); cur = ch; return; } }
    cur.push(p);
  });
  return chains.filter(c => c.length >= 2 && c.some(p => p.dep != null));
}

// ---------------- расчёт ----------------
function buildGnb(P, g) {
  const warn = [], chains = gnbChains(P);
  if (!chains.length) throw new Error('В съёмке нет перехода ГНБ: нужны точки 4028 с глубиной в номере («2-1.36»).');
  const ci = Math.min(Math.max(+g.chain || 0, 0), chains.length - 1);
  let ch = chains[ci].map(p => Object.assign({}, p));
  if (ch[0].x > ch[ch.length - 1].x) ch.reverse();          // нумерация с запада (слева на профиле), как в принятых ИЧ
  if (g.reverse) ch.reverse();
  const d = (num(g.d) || 110) / 1000, Dskv = (num(g.dskv) || 700) / 1000, pit = num(g.pit) != null ? num(g.pit) : 0.70;
  // локатор даёт глубину до оси; верх трубы = земля − глубина + поправка (по умолчанию половина d, округлённая вниз до см: d110 → 0,05)
  const dcorr = num(g.dcorr) != null ? num(g.dcorr) : Math.floor(d * 100 / 2 + 1e-9) / 100;
  const situ = P.filter(p => /^7\d{2,}$/.test(p.code));
  ch.forEach((p, i) => {
    p.k = i + 1;
    if (p.dep != null) { p.ground = p.H; p.top = p.H - p.dep + dcorr; p.gsrc = 'съёмка'; return; }
    p.top = p.H;                                             // приямок: отметка верха трубы снята прямо
    const end = i === 0 || i === ch.length - 1, user = num(i === 0 ? g.groundA : i === ch.length - 1 ? g.groundB : null);
    if (!end) warn.push('т.' + p.n + ' в середине перехода без глубины — отметка принята как верх трубы, земля = верх + ' + fnum(pit) + '.');
    if (user != null) { p.ground = user; p.gsrc = 'введено'; return; }
    const near = situ.filter(q => dist(q, p) < 6).sort((a, b) => dist(a, p) - dist(b, p))[0];
    // точка ситуации рядом с приямком — только если труба под ней не мельче приямка (иначе это не земля над трубой)
    if (near && end && near.H - p.top >= pit - 1e-9) { p.ground = near.H; p.gsrc = 'т.' + near.n + ' (' + fnum(dist(near, p), 1) + ' м)'; }
    else { p.ground = p.top + pit; p.gsrc = 'верх + ' + fnum(pit); }
  });
  // в таблицу и в каталог идут округлённые отметки; глубина и уклоны — из них, чтобы цифры на ИЧ сходились между собой
  ch.forEach(p => { p.top = rnd(p.top, 2); p.ground = rnd(p.ground, 2); });
  const segs = [];
  let st = 0;
  ch.forEach((p, i) => {
    p.st = st;
    if (i < ch.length - 1) {
      const q = ch[i + 1], L = dist(p, q), dh = q.top - p.top;
      segs.push({ a: p, b: q, L, dh, i: L > 0 ? dh / L : 0, len: Math.hypot(L, dh) });
      st += L;
    }
  });
  // длины перехода — суммы того, что написано в таблице профиля (расстояния до 0,1 м, длины до 0,01 м), как в принятых ИЧ
  const Lplan = segs.reduce((t, s) => t + rnd(s.L, 1), 0), Lprof = segs.reduce((t, s) => t + rnd(s.len, 2), 0);
  const Lexact = segs.reduce((t, s) => t + s.L, 0);
  ch.forEach(p => { p.depth = rnd(p.ground - p.top, 2); });
  const minDepth = Math.min(...ch.map(p => p.depth)), maxDepth = Math.max(...ch.map(p => p.depth));
  if (ch.some(p => p.depth < 0)) warn.push('Есть точки, где верх трубы выше земли — проверьте глубины и отметки.');
  // кабели в трубах
  const cables = parseCables(g.cables), used = cables.reduce((t, c) => t + c.k, 0), nP = +g.n || 1;
  if (used > nP) warn.push('Кабелей (' + used + ') больше, чем труб (' + nP + ').');
  return { kind: 'gnb', chains, ci, pts: ch, segs, Lplan, Lprof, Lexact, dcorr, d, Dskv, minDepth, maxDepth, cables, warn };
}
// «9к ВБвШВ 3x16-ЭС», «1кл ОКБ-0,22-24-П-7,0-ВОЛС» — число кабелей и подпись; цвет по назначению
const NET_COL = [[/-?ЭС\s*$/i, 1], [/-?НО\s*$/i, 6], [/ВОЛС/i, 3], [/-?ОДН\s*$/i, 5]];
function parseCables(txt) {
  return String(txt || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = /^(\d+)\s*(к|кл|каб)\.?\s*(.*)$/i.exec(s), col = (NET_COL.find(c => c[0].test(s)) || [0, 7])[1];
    return { k: m ? +m[1] : 1, s, col };
  });
}
// «ПЛИТ; 4.5» — покрытие до 4,5 м от начала (по плану); последняя строка без числа — до конца
function parseCover(txt, Ltot) {
  let a = 0; const out = [];
  String(txt || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(s => {
    const p = s.split(/\t|;/).map(x => x.trim()), to = num(p[1]);
    const b = to != null ? Math.min(to, Ltot) : Ltot; if (b > a) out.push({ a, b, s: p[0] }); a = b;
  });
  return out;
}
// «5.0; Водопровод d400 170,49в.тр.; 170.49» — пересечение: расстояние от т.1 по плану, подпись, отметка (необязательно)
function parseCross(txt) {
  return String(txt || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(s => { const p = s.split(/\t|;/).map(x => x.trim()); return { at: num(p[0]), s: p[1] || '', h: num(p[2]) }; }).filter(c => c.at != null);
}
// протокол бурения: штанги по плану от точки входа; уклон — на длине штанги, глубина — до оси на её конце
function drillRods(m, g) {
  const rod = num(g.rod) || 3.05, cnt = Math.floor(m.Lprof / rod + 1e-9), P = m.pts;
  const at = (s, key) => { s = Math.min(Math.max(s, 0), m.Lexact); for (let i = 0; i < P.length - 1; i++) if (s <= P[i + 1].st + 1e-9) { const t = (s - P[i].st) / ((P[i + 1].st - P[i].st) || 1); return P[i][key] + (P[i + 1][key] - P[i][key]) * t; } return P[P.length - 1][key]; };
  const rods = [];
  for (let k = 1; k <= cnt; k++) {
    const s = Math.min(rod * k, m.Lexact), s0 = rod * (k - 1);
    const sl = Math.round((at(s, 'top') - at(s0, 'top')) / ((s - s0) || rod) * 100), dp = Math.round((at(s, 'ground') - at(s, 'top') + m.dcorr) * 100);
    rods.push({ k, slope: (sl > 0 ? '+' : sl < 0 ? '-' : '') + Math.abs(sl), depth: dp });
  }
  return rods;
}

// ---------------- чертёж ----------------
const LG = { plan: 'ГНБ_трасса', pt: 'ГНБ_точки', otm: 'ГНБ_отметки', dim: 'ГНБ_длины', prof: 'ГНБ_профиль', net: 'ГНБ_труба', grd: 'ГНБ_земля',
  val: 'ГНБ_таблица', crs: 'ГНБ_пересечения', sec: 'ГНБ_сечения', stamp: 'ГНБ_штамп' };
const K = 5;   // 1:100 на листе 1:500 (1 м = 1 ед. плана)
const ROWS_G = [['Фактические отметки земли', 10], ['Отметки верха трубы', 10], ['Глубина заложения трубы', 7], ['Расстояние', 7], ['Уклон|Длина', 10],
  ['Материал и диаметр труб', 7], ['Покрытие', 7], ['Контрольные точки', 7]];
const pipeMark = g => 'Труба ' + (g.mat || 'ПЭ 100') + ' SDR ' + (g.sdr || '13.6') + ' ' + (g.n || 1) + 'd' + (g.d || 110) + ' ' + (g.gost || '');
const title = g => 'Закрытый переход N' + (g.no || '');

function drawGnbPlan(D, m, g, opt) {
  const P = m.pts, c = P.map(p => [p.x, p.y]);
  D.poly(LG.plan, c, 7);
  P.forEach((p, i) => {
    D.circle(LG.pt, p.x, p.y, 0.12, 7);
    const q = P[Math.min(i + 1, P.length - 1)], r = P[Math.max(i - 1, 0)], u = I.unit([r.x, r.y], [q.x, q.y]);
    const nx = u[1], ny = -u[0];   // номер — справа от хода (снизу), отметка — слева (сверху)
    D.text(LG.pt, String(p.k), p.x + nx * 1.2, p.y + ny * 1.2 - 0.3, 1.0, 0, 1, 7);
    if (opt.marks) D.text(LG.otm, f2(p.top), p.x - nx * 0.8, p.y - ny * 0.8, 0.3, 0, 1, 2);
  });
  // «L=3.90» на выносках над каждым отрезком, как в принятых ИЧ
  m.segs.forEach((s, i) => {
    const mx = (s.a.x + s.b.x) / 2, my = (s.a.y + s.b.y) / 2, u = I.unit([s.a.x, s.a.y], [s.b.x, s.b.y]);
    let nx = -u[1], ny = u[0]; if (ny < 0) { nx = -nx; ny = -ny; }
    const k = 4 + (i % 2) * 2.5, lx = mx + nx * k, ly = my + ny * k, t = 'L=' + f2(rnd(s.L, 1));
    D.line(LG.dim, mx, my, lx, ly, 7); D.line(LG.dim, lx, ly, lx - t.length * 0.62, ly, 7);
    D.text(LG.dim, t, lx - t.length * 0.31, ly + 0.65, 1.0, 0, 1, 7);
  });
  // выноска с составом перехода
  const s = m.segs[Math.floor(m.segs.length / 2)], mx = (s.a.x + s.b.x) / 2, my = (s.a.y + s.b.y) / 2;
  const tx = mx - 3, ty = my - 12, lines = ['Закрытый переход методом ГНБ N' + (g.no || ''), (g.n || 1) + ' труб d' + (g.d || 110) + ' ' + (g.mat || '') + ' SDR ' + (g.sdr || ''), 'Lв плане=' + fnum(m.Lplan) + 'м', 'Lв профиле=' + fnum(m.Lprof) + 'м'];
  D.line(LG.dim, mx, my, tx, ty + 0.6, 7); D.line(LG.dim, tx, ty + 0.6, tx + lines[0].length * 0.62, ty + 0.6, 7);
  lines.forEach((t, i) => D.text(LG.dim, t, tx, ty - i * 1.6, 1.0, 0, 0, 7));
}

function drawGnbProfile(D, m, g, X0, Ytop) {
  const P = m.pts, Lt = m.Lexact;
  const hs = P.map(p => p.top - m.Dskv).concat(parseCross(g.cross).filter(c => c.h != null).map(c => c.h));
  const Hc = Math.floor(Math.min(...hs) - 1), Hmax = Math.max(...P.map(p => p.ground)) + 1;
  const YB = Ytop - (Hmax - Hc) * K;                       // условный горизонт — верх таблицы
  const X = st => X0 + st * K, Y = h => YB + (h - Hc) * K, xr = X(Lt);
  const xl = X0 - 70, xh = X0 - 12;
  // заголовок
  const tl = [['Продольный профиль', 2.0], [title(g), 2.0], ['длина по плану ' + fnum(m.Lplan) + 'м', 2.0], ['длина по профилю ' + fnum(m.Lprof) + 'м', 2.0]];
  tl.forEach((t, i) => D.text(LG.prof, t[0], (X0 + xr) / 2, Y(Hmax) + 16 - i * 3, t[1], 0, 1, 7));
  // линейка высот
  D.line(LG.prof, xh, YB, xh, Y(Math.ceil(Hmax)), 7);
  for (let h = Hc; h <= Math.ceil(Hmax); h++) { D.line(LG.prof, xh - 1, Y(h), xh, Y(h), 7); if (h % 2 === 1 || h === Hc) D.text(LG.prof, f2(h), xh - 1.5, Y(h), 1.5, 0, 2, 7); }
  [['Продольный профиль', 2.0], ['М вертикальный 1:100', 2.0], ['М горизонтальный 1:100', 2.0], ['Условный горизонт ' + f2(Hc) + 'м', 2.0]]
    .forEach((t, i) => D.text(LG.prof, t[0], xl, YB + 12 - i * 3, t[1], 0, 0, 7));
  // таблица
  const ys = [YB]; ROWS_G.forEach(r => ys.push(ys[ys.length - 1] - r[1]));
  const mid = i => (ys[i] + ys[i + 1]) / 2;
  ys.forEach(y => D.line(LG.val, xl, y, xr, y, 7));
  [xl, X0].forEach(x => D.line(LG.val, x, ys[0], x, ys[ys.length - 1], 7)); D.line(LG.val, xr, ys[0], xr, ys[ys.length - 1], 7);
  ROWS_G.forEach(([nm], i) => {
    if (nm.includes('|')) { const [a, b] = nm.split('|'); D.text(LG.val, a, X0 - 2, ys[i] - 2.5, 2.0, 0, 2, 7); D.text(LG.val, b, xl + 1.5, ys[i + 1] + 2.5, 2.0, 0, 0, 7); D.line(LG.val, xl, ys[i], X0, ys[i + 1], 7); }
    else D.text(LG.val, nm, xl + 1.5, mid(i), 2.0, 0, 0, 7);
  });
  // земля, труба, скважина
  D.poly(LG.grd, P.map(p => [X(p.st), Y(p.ground)]), 7);
  D.poly(LG.net, P.map(p => [X(p.st), Y(p.top)]), 7);
  D.poly(LG.net, P.map(p => [X(p.st), Y(p.top - m.Dskv)]), 7);
  P.forEach(p => {
    const x = X(p.st);
    D.line(LG.prof, x, Y(p.ground), x, YB, 7);
    D.line(LG.val, x, ys[0], x, ys[3], 7); D.line(LG.val, x, ys[3], x, ys[5], 7);
    D.text(LG.val, f2(p.ground), x - 0.9, mid(0), 1.5, 90, 1, 7);
    D.text(LG.val, f2(p.top), x - 0.9, mid(1), 1.5, 90, 1, 7);
    D.text(LG.val, f2(p.depth), x - 0.9, mid(2), 1.5, 90, 1, 7);
    D.circle(LG.val, x, mid(7), 1.0, 7); D.text(LG.val, String(p.k), x, mid(7), 1.3, 0, 1, 7);
  });
  m.segs.forEach(s => {
    const xa = X(s.a.st), xb = X(s.b.st), xm = (xa + xb) / 2, down = s.dh < 0;
    D.text(LG.val, f1(s.L), xm, mid(3), 1.5, 0, 1, 7);
    // уклон — над диагональю, длина — под ней; диагональ — по направлению уклона
    if (down) { D.line(LG.val, xa, ys[4], xb, ys[5], 7); D.text(LG.val, f3(Math.abs(s.i)), xb - 0.6, ys[4] - 2.2, 1.5, 0, 2, 7); D.text(LG.val, f2(s.len), xa + 0.6, ys[5] + 2.2, 1.5, 0, 0, 7); }
    else { D.line(LG.val, xa, ys[5], xb, ys[4], 7); D.text(LG.val, f3(Math.abs(s.i)), xa + 0.6, ys[4] - 2.2, 1.5, 0, 0, 7); D.text(LG.val, f2(s.len), xb - 0.6, ys[5] + 2.2, 1.5, 0, 2, 7); }
  });
  D.text(LG.val, pipeMark(g), (X0 + xr) / 2, mid(5), 1.5, 0, 1, 7);
  parseCover(g.cover, Lt).forEach((c, i, a) => { if (i < a.length - 1) D.line(LG.val, X(c.b), ys[6], X(c.b), ys[7], 7); D.text(LG.val, c.s, (X(c.a) + X(c.b)) / 2, mid(6), 1.5, 0, 1, 7); });
  // пересечения с коммуникациями
  const gAt = s => { for (let i = 0; i < P.length - 1; i++) if (s <= P[i + 1].st + 1e-9) { const t = (s - P[i].st) / ((P[i + 1].st - P[i].st) || 1); return P[i].ground + (P[i + 1].ground - P[i].ground) * t; } return P[P.length - 1].ground; };
  parseCross(g.cross).forEach(c => {
    const s = Math.min(Math.max(c.at, 0), Lt), x = X(s), yg = Y(gAt(s)), yb = c.h != null ? Y(c.h) : YB;
    D.line(LG.crs, x, yg, x, yb, 7); if (c.h != null) D.circle(LG.crs, x, yb, 0.4, 7);
    D.text(LG.crs, c.s, x - 0.8, YB + 1, 1.5, 90, 0, 7);
  });
  // знаки сечений 1-1 и 2-2
  [[X0, '1', -1], [xr, '2', 1]].forEach(([x, t, sd]) => {
    const p = sd < 0 ? P[0] : P[P.length - 1];
    [Y(p.ground) + 3, Y(p.top) - 1].forEach(y => { D.line(LG.sec, x, y, x + sd * 2.2, y, 7); D.text(LG.sec, t, x + sd * 2.2, y + 1.6, 2.5, 0, 1, 7); });
  });
  return { yb: ys[ys.length - 1], xl, xr, ytop: Y(Hmax) + 4 };
}

// упаковка труб в скважине: ближайшие узлы шестиугольной сетки (с центром в узле или в центре треугольника)
function pack(n) {
  const best = [];
  [[0, 0], [0.5, Math.sqrt(3) / 6]].forEach(o => {
    const c = [];
    for (let j = -6; j <= 6; j++) for (let i = -6; i <= 6; i++) { const x = i + (j % 2 ? 0.5 : 0) - o[0], y = j * Math.sqrt(3) / 2 - o[1]; c.push([x, y]); }
    c.sort((a, b) => Math.hypot(...a) - Math.hypot(...b) || b[1] - a[1] || a[0] - b[0]);
    const pick = c.slice(0, n), R = Math.max(...pick.map(q => Math.hypot(...q)));
    best.push({ pick, R });
  });
  best.sort((a, b) => a.R - b.R);
  // нумерация — сверху вниз, слева направо
  return best[0].pick.sort((a, b) => b[1] - a[1] || a[0] - b[0]);
}
function drawSection(D, m, g, cx, cy, label, mirror) {
  const S = 25, R = m.Dskv / 2 * S, r = m.d / 2 * S, n = +g.n || 1, pos = pack(n).map(q => [q[0] * m.d * S * (mirror ? -1 : 1), q[1] * m.d * S]);
  D.text(LG.sec, 'Сечение перехода ' + label, cx, cy + R + 6, 1.5, 0, 1, 7);
  D.circle(LG.sec, cx, cy, R, 7);
  D.line(LG.sec, cx - R - 2, cy, cx + R + 2, cy, 8); D.line(LG.sec, cx, cy - R - 2, cx, cy + R + 2, 8);
  const occ = []; m.cables.forEach(c => { for (let k = 0; k < c.k; k++) occ.push(c); });
  pos.forEach((q, i) => {
    D.circle(LG.sec, cx + q[0], cy + q[1], r * 0.96, 7);
    D.text(LG.sec, String(i + 1), cx + q[0], cy + q[1] + r * 0.2, Math.min(2.2, r * 0.9), 0, 1, 7);
    if (occ[i]) D.circle(LG.sec, cx + q[0], cy + q[1] - r * 0.45, 0.25, occ[i].col);
  });
  D.line(LG.sec, cx - R * 0.7, cy + R * 0.7, cx - R - 6, cy + R + 2, 7); D.text(LG.sec, 'Дскв=' + (g.dskv || '') + ' мм', cx - R - 7, cy + R + 2.7, 1.25, 0, 2, 7);

function computeLine(P, net) {

  let k = D.e.length; I.drawLine(D, m, { marks: !!S.set.marks, dims: S.set.dims !== false, nums: S.set.nums !== false }); D.mark('plan', k);
  const xs = m.points.map(p => p.x), ys = m.points.map(p => p.y);

function computeGnb(P) {

// ---------- открытие файлов ----------
async function openFile(f) {
  try {
    const bytes = new Uint8Array(await f.arrayBuffer()), ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
    let raw;
    if (ext === '.json') { loadProject(JSON.parse(new TextDecoder().decode(bytes))); return; }
    const purpose = S.pickFor; S.pickFor = null;
    if (ext === '.pdf') { if (S.pdf) URL.revokeObjectURL(S.pdf.url); S.pdf = { name: f.name, url: URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })) }; S.tab = 'pdf'; render(); toast('Проект открыт: ' + f.name + '. Сверяйте на вкладке «Проект»; спецификацию вставьте справа или откройте DXF проекта.'); return; }
    if (ext === '.dxf' && purpose === 'proj') { loadProjDXF(f.name, I.decode(bytes, true)); return; }
    if (ext === '.dxf' && purpose === 'geo') { loadGeo(f.name, I.decode(bytes, true)); return; }
    if (ext === '.dxf') { const txt = I.decode(bytes, true); raw = I.readDXF(txt); if (!raw.length) { if (/проект|иот|спец|ИОТ/i.test(f.name)) loadProjDXF(f.name, txt); else loadGeo(f.name, txt); return; } }
    else if (ext === '.are' || ext === '.pco') raw = I.readARE(I.decode(bytes, false));
    else { toast('Не знаю такой формат: ' + f.name + '. Нужен DXF, .are, .pco или проект .json.'); return; }
    if (!raw.length) { toast(ext === '.dxf' ? 'В файле нет точек-блоков _block2 с отметкой.' : 'В файле не нашлось точек.'); return; }
    if (S.demoProj) { S.proj = { object: '', wells: [], spans: [] }; S.demoProj = false; S.set.mode = 'fact'; }
    S.file = f.name; S.raw = raw; S.parsed = I.parsePoints(raw); S.set.start = 'auto'; S.set.net = null; S.view = null; S.tab = 'plan'; S.gnb.chain = 0; S.gnb.groundA = S.gnb.groundB = '';
    compute(); render(); toast('Открыто: ' + f.name + ' — ' + S.parsed.pts.length + ' точек' + (hasProject() ? '. Проект — из прошлой работы: проверьте его справа или очистите.' : ''));
  } catch (e) { toast('Не удалось прочитать ' + f.name + ': ' + e.message); }
}
function loadGeo(name, txt) {
  toast('Читаю геоподоснову ' + name + '…');
  setTimeout(() => {
    try { const G = I.readGeo(txt); S.geo = { name, G }; compute(); render(); toast('Геоподоснова: ' + name + ' — ' + G.layers.size + ' слоёв. На ИЧ ложится окно вокруг сети.'); }
    catch (e) { toast('Не удалось прочитать геоподоснову: ' + e.message); }
  }, 30);
}
function loadProjDXF(name, txt) {
  try {
    const G = I.readGeo(txt), rows = I.textRows(G), sp = I.parseSpec(rows.join('\n'));
    const keep = [...sp.pipes, ...sp.cables].map(x => x.src);
    if (!keep.length) { toast('В DXF проекта не нашлось строк с трубами и кабелями.'); return; }
    S.spec = { text: [...new Set(keep)].join('\n'), src: name + ' (' + keep.length + ' строк)' }; save(); compute(); render();
    toast('Спецификация из ' + name + ': труб ' + sp.pipes.length + ', кабелей ' + sp.cables.length + '. Проверьте справа.');
  } catch (e) { toast('Не удалось прочитать проект: ' + e.message); }
}
function loadProject(p) {
  if (!p || !Array.isArray(p.wells)) { toast('Это не файл проекта ИЧ (нет списка колодцев).'); return; }
  S.demoProj = false;
  S.proj = { object: p.object || '', wells: p.wells.map(w => Object.assign({ name: '', type: '', top: null, bottom: null, neck: null, pipe_in: null, pipe_out: null }, w)),
    spans: (p.spans || []).map(s => Object.assign({ n: null, d: null, len: null, casing: null }, s)) };
  if (S.set.mode === 'fact' && S.parsed) toast('Проект загружен. Чтобы подогнать ИЧ, выберите «Под проект».'); else toast('Проект загружен.');
  save(); compute(); render();
}

  if (S.res && S.res.kind === 'line') { const p = S.res.m.poles, old = S.proj.poles || []; S.proj.poles = p.map((q, i) => old[i] || q.name); save(); compute(); render(); toast('Опор: ' + p.length + '. Впишите имена из проекта или вставьте столбец из Excel.'); return; }

}

function fitView(name) {
  const b = S.res && (S.res.D.box[name] || S.res.D.box.all); if (!b) return;
  const pad = Math.max(b[2] - b[0], b[3] - b[1]) * 0.04 + 2;
  S.view = [b[0] - pad, -b[3] - pad, b[2] - b[0] + 2 * pad, b[3] - b[1] + 2 * pad]; applyView();
}
function applyView() { const s = $('#svg'); if (s && S.view) s.setAttribute('viewBox', S.view.map(v => v.toFixed(3)).join(' ')); }
function zoomAt(f, cx, cy) {
  const s = $('#svg'); if (!s || !S.view) return; const r = s.getBoundingClientRect(), v = S.view;
  const sc = Math.max(v[2] / r.width, v[3] / r.height), ox = v[0] + (v[2] - r.width * sc) / 2, oy = v[1] + (v[3] - r.height * sc) / 2;
  const wx = ox + cx * sc, wy = oy + cy * sc;
  S.view = [wx - (wx - v[0]) / f, wy - (wy - v[1]) / f, v[2] / f, v[3] / f]; applyView();
}
function bindView() {
  const s = $('#svg'); if (!s) return;
  if (!S.view) fitView(S.tab); else applyView();
  s.addEventListener('wheel', e => { e.preventDefault(); const r = s.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  s.addEventListener('dblclick', e => { const r = s.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
  let drag = null;
  s.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; s.setPointerCapture(e.pointerId); s.classList.add('grab'); });
  s.addEventListener('pointermove', e => { if (!drag) return; const r = s.getBoundingClientRect(), v = S.view, sc = Math.max(v[2] / r.width, v[3] / r.height); v[0] -= (e.clientX - drag.x) * sc; v[1] -= (e.clientY - drag.y) * sc; drag = { x: e.clientX, y: e.clientY }; applyView(); });
  const up = () => { drag = null; s.classList.remove('grab'); }; s.addEventListener('pointerup', up); s.addEventListener('pointercancel', up);
  const c = () => { const r = s.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  $('#zin').onclick = () => zoomAt(1.5, ...c()); $('#zout').onclick = () => zoomAt(1 / 1.5, ...c()); $('#zfit').onclick = () => fitView(S.tab);
}

// ---------- события ----------
function pick(accept) { const p = $('#picker'); p.accept = accept; p.value = ''; p.click(); }
$('#picker').onchange = () => { [...$('#picker').files].forEach(openFile); };
function bindTop() {
  $('#open').onclick = () => { S.pickFor = null; pick('.dxf,.are,.pco'); };
  $('#geotop').onclick = () => { S.pickFor = 'geo'; pick('.dxf'); };
  $('#projtop').onclick = () => { S.pickFor = 'proj'; pick('.pdf,.dxf'); };
  $('#demo').onclick = openDemo; $('#help').onclick = showHelp; bindProj();
}
function bindEmpty() {
  $('#open2').onclick = () => pick('.dxf,.are,.pco'); $('#demo2').onclick = openDemo;
  $('#drop').onclick = e => { if (e.target.id === 'drop' || e.target.tagName === 'H1' || e.target.tagName === 'P') pick('.dxf,.are,.pco'); };
}
function openDemo() {
  const raw = I.demo(); S.file = 'Пример (условные данные).dxf'; S.raw = raw; S.parsed = I.parsePoints(raw); S.set.start = 'auto'; S.set.net = null; S.view = null; S.tab = 'plan';
  if (!hasProject() || S.demoProj) { S.proj = JSON.parse(JSON.stringify(I.DEMO_PROJECT)); S.demoProj = true; }
  compute(); render(); toast('Открыт пример с условными данными и проектом к нему.');
}
let deb; const later = () => { clearTimeout(deb); deb = setTimeout(() => {
  const a = document.activeElement, key = a && a.dataset && a.dataset.g ? ['[data-g="' + a.dataset.g + '"]', 'sel', null, a.selectionStart] : a && a.dataset && a.dataset.obj ? ['[data-obj="' + a.dataset.obj + '"]', 'sel', null, a.selectionStart] : a && a.dataset && a.dataset.t ? [a.dataset.t, a.dataset.r, a.dataset.c, a.selectionStart] : a && a.id ? [a.id, null, null, a.selectionStart] : null;
  save(); compute(); render();
  if (key) { const el = key[1] === 'sel' ? document.querySelector(key[0]) : key[1] == null ? document.getElementById(key[0]) : document.querySelector('.ptab input[data-t="' + key[0] + '"][data-r="' + key[1] + '"][data-c="' + key[2] + '"]'); if (el) { el.focus(); try { el.setSelectionRange(key[3], key[3]); } catch (e) { /* поле без курсора */ } } }
}, 500); };
function bindWork() {
  bindCommon(); bindObj();
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { if (b.disabled) return; S.set.mode = b.dataset.mode; save(); compute(); render(); });
  document.querySelectorAll('[data-tol]').forEach(b => b.onclick = () => { S.set.tol = +b.dataset.tol; save(); compute(); render(); });
  document.querySelectorAll('[data-well]').forEach(b => b.onclick = () => {
    const w = S.res.order[+b.dataset.well]; S.tab = 'plan'; S.view = null; render();
    S.view = [w.c.x - 15, -w.c.y - 10, 30, 20]; applyView();
  });
  const tol = $('#tol'); if (tol) tol.oninput = () => { S.set.tol = num(tol.value) || 0; later(); };
  $('#prof').onchange = e => { S.set.profile = e.target.checked; S.view = null; save(); compute(); render(); };
  $('#start').onchange = e => { S.set.start = e.target.value; save(); compute(); render(); };
  $('#csv').onclick = () => {
    if (!S.res || !S.res.rows) return;
    const q = v => { v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const lines = [['Режим построения', S.res.mode], ['Элемент', 'Параметр', 'Проект', 'Съёмка', 'Расхождение, м', 'На ИЧ', 'Примечание']].concat(S.res.rows.map(x => [x.el, x.par, x.pv, x.fv, x.d.replace('−', '-'), x.used, x.note]));
    download(new TextEncoder().encode('﻿' + lines.map(l => l.map(q).join(';')).join('\r\n')), baseName() + ' — расхождения.csv', 'text/csv');
  };
  $('#fill').onclick = fillRows;
  $('#pload').onclick = () => pick('.json');
  $('#psave').onclick = () => { const p = { object: S.proj.object || baseName(), wells: S.proj.wells, spans: S.proj.spans }; download(new TextEncoder().encode(JSON.stringify(p, null, 1)), baseName() + ' — проект.json', 'application/json'); };
  $('#pclear').onclick = () => { if (!confirmClear()) return; S.proj = { object: '', wells: [], spans: [] }; S.set.mode = 'fact'; save(); compute(); render(); };
  document.querySelectorAll('.ptab input').forEach(inp => {
    inp.oninput = () => { S.demoProj = false; setCell(inp.dataset.t, +inp.dataset.r, +inp.dataset.c, inp.value); later(); };
    inp.onpaste = e => {
      const txt = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(txt.trim())) return;
      e.preventDefault(); const t = inp.dataset.t, r0 = +inp.dataset.r, c0 = +inp.dataset.c, ncol = t === 'w' ? COLS_W.length : COLS_S.length;
      txt.replace(/\r/g, '').replace(/\n$/, '').split('\n').forEach((line, i) => line.split('\t').forEach((v, j) => { if (c0 + j < ncol) setCell(t, r0 + i, c0 + j, v); }));
      save(); compute(); render(); toast('Вставлено из буфера.');
    };
  });
  bindView();
}
let clearArmed = 0; function confirmClear() { if (Date.now() - clearArmed < 4000) return true; clearArmed = Date.now(); toast('Нажмите «Очистить» ещё раз, чтобы удалить проект.'); return false; }

function showHelp() {
  const v = document.createElement('div'); v.className = 'veil';
  v.innerHTML = '<div class="modal wide"><div class="modal-head"><h2>Справка</h2><button class="btn small" id="hx">Закрыть</button></div><div class="modal-body help">'
    + '<h3>Что делает программа</h3><p>По съёмке строит исполнительный чертёж телефонной канализации: план трассы с колодцами, пролётами и футлярами, профиль с таблицей и ведомость колодцев. Сверяет съёмку с проектом и показывает, что расходится. Всё считается в браузере, файлы никуда не уходят.</p>'
    + '<h3>Какие сети</h3><p>Сеть определяется по кодам «Абриса». Сейчас ИЧ строится для <b>телефонной канализации</b> (план, профиль, ведомость колодцев, сверка с проектом) и для <b>кабеля НО / ЭС</b> (план с опорами, трубами и футлярами, ведомость участков). Для <b>закрытого перехода ГНБ</b> — профиль с таблицей, план с длинами, сечения 1-1 и 2-2 с кабелями, штамп, каталог (№, X, Y, H) и протокол бурения. Остальные сети — кабельная канализация, кабельная линия, водопровод, теплосеть, канализация, газопровод, водосток — распознаются и показываются слева; ИЧ для них добавим по образцам. Если в съёмке несколько сетей, выберите нужную слева.</p>'
    + '<h3>Какая нужна съёмка</h3><p>DXF с блоками точек <b>_block2</b> (атрибуты №, H, TXT) или полевой файл .are / .pco. Коды — по «Абрису»:</p>'
    + '<table class="sum"><tr><th>Код</th><th>Доп. код</th><th>Что это</th></tr><tr><td>476</td><td>_kks-2, _kks-3, _2,99x1,60</td><td>обечайка, центр колодца; тип или размер камеры</td></tr><tr><td>47</td><td>_np / _vp</td><td>низ / верх плиты</td></tr><tr><td>99</td><td></td><td>дно колодца</td></tr><tr><td>478</td><td>_1d110, _24d125</td><td>верх трубы; число и диаметр труб</td></tr><tr><td>4028</td><td>_1d325</td><td>верх футляра; участок — футляр, если оба конца 4028</td></tr><tr><td>4028 / 4028..</td><td>номер «2-1.36»</td><td>ГНБ: земля над трубой и глубина локатора до оси; без глубины — верх трубы в приямке</td></tr></table>'
    + '<p>Связи: <b>..</b> — с предыдущей точкой, <b>..N</b> — с точкой N, <b>..,N</b> — с предыдущей и с N. Трубы должны начинаться и заканчиваться у колодцев (ближе 2 м от обечайки).</p>'
    + '<h3>Проект и подгонка</h3><p>Колодцы проекта сопоставляются со съёмкой по порядку вдоль трассы; направление хода выбирается по лучшему совпадению отметок (или задайте «Начало хода»). В режиме «под проект» значения, отличающиеся не больше допуска, берутся из проекта, остальные — по съёмке. Подгоняются обечайки, дно, горловина, верх трубы на входе и выходе, длины пролётов и футляров. План и промежуточные точки трубы остаются по съёмке.</p>'
    + '<p>Проект сохраняется в браузере автоматически; файлом (.json) его можно перенести на другой компьютер.</p>'
    + '<h3>Что пока не умеет</h3><p>Ответвления трассы, развёртки колодцев, линию земли и пересечения с коммуникациями (нужна геоподоснова), рамку и штамп, чтение проекта прямо из ИД.</p>'
    + '</div></div>';
  document.body.appendChild(v); v.onclick = e => { if (e.target === v || e.target.id === 'hx') v.remove(); };
}

// ---------- перетаскивание файлов ----------
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); [...e.dataTransfer.files].forEach(openFile); });
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || !$('#svg')) return;
  const s = $('#svg').getBoundingClientRect();
  if (e.key === '+' || e.key === '=') zoomAt(1.5, s.width / 2, s.height / 2); else if (e.key === '-') zoomAt(1 / 1.5, s.width / 2, s.height / 2); else if (e.key === '0') fitView(S.tab);
});
render();
})();
</script>
